<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ pwa_config.THEME_COLOR }}">
  <title>{{ pwa_config.NAME }} · Hors ligne</title>
  <link rel="icon" href="{{ pwa_config.ICON_SRC }}">
  <script src="/static/offline.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: {{ pwa_config.BACKGROUND_COLOR }};
      color: #edf4ff;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      background: radial-gradient(ellipse at 50% 15%, #2f8cff18, transparent 65%);
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 40px 28px 28px;
      text-align: center;
      background: #111821;
      border: 1px solid #263343;
      border-radius: 24px;
      box-shadow: 0 24px 80px #0005;
    }
    .logo { display: block; width: 96px; height: 96px; object-fit: contain; margin: 0 auto 20px; border-radius: 20px; }
    .brand { margin: 0 0 28px; font-size: 14px; font-weight: 600; color: #aebdd0; overflow-wrap: anywhere; }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; color: #f6cd88; background: #f6cd8810; font-size: 12px; font-weight: 600; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    h1 { margin: 20px 0 12px; font-size: clamp(24px, 5vw, 30px); line-height: 1.2; letter-spacing: -.6px; overflow-wrap: anywhere; }
    .message { margin: 0; color: #aebdd0; font-size: 15px; line-height: 1.7; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; margin: 28px 0; min-height: 48px; padding: 12px 24px; background: #2f8cff; border: 1px solid #5ca5ff; border-radius: 12px; color: #fff; font: inherit; font-size: 15px; font-weight: 650; cursor: pointer; }
    button:hover { background: #2479e1; }
    button:focus-visible { outline: 3px solid #8ed7ff; outline-offset: 4px; }
    button svg { width: 18px; height: 18px; }
    footer { padding-top: 20px; border-top: 1px solid #263343; font-size: 12px; line-height: 1.6; color: #92a2b6; }
    @media (max-width: 360px) { main { padding: 28px 20px 24px; } }
  </style>
</head>
<body>
  <main aria-labelledby="offline-title">
    <img class="logo" src="{{ pwa_config.ICON_SRC }}" alt="" width="96" height="96">
    <p class="brand">{{ pwa_config.NAME }}</p>
    <span class="status">Connexion indisponible</span>
    <h1 id="offline-title">{{ pwa_config.SHORT_NAME }} est hors ligne</h1>
    <p class="message">Le serveur n’est pas joignable pour le moment.<br>Vérifiez votre connexion au réseau ou réessayez dans quelques instants.</p>
    <button type="button" data-retry data-start-url="{{ pwa_config.START_URL }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4.9 8a8 8 0 0 1 13.2-2L20 8M4 17v-5h5"/><path d="M19.1 16a8 8 0 0 1-13.2 2L4 16"/></svg>
      Réessayer
    </button>
    <noscript><p><a href="{{ pwa_config.START_URL }}">Revenir à {{ pwa_config.SHORT_NAME }}</a></p></noscript>
    <footer>Vos fichiers restent sur votre NAS.</footer>
  </main>
</body>
</html>
